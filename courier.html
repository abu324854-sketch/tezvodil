<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TezVodil - Kuryer Paneli & Takso-Taksometr</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 pb-10 antialiased selection:bg-emerald-500 selection:text-white">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-emerald-600 p-2 rounded-xl">
                    <i class="fa-solid fa-motorcycle text-xl text-yellow-300"></i>
                </div>
                <div>
                    <h1 class="text-base font-black">TezVodil Kuryer</h1>
                    <p class="text-[10px] text-emerald-400 font-semibold">Taksi-Taksometr Tizimi</p>
                </div>
            </div>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-xl border border-slate-700 font-bold">
                <i class="fa-solid fa-arrow-left mr-1"></i> Asosiy
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- JONLI TAKSOMETR (TAXI METER) EKRANI -->
        <div id="taximeterBox" class="bg-slate-900 text-white p-5 rounded-3xl shadow-2xl border-2 border-emerald-500/50 relative overflow-hidden hidden">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <span class="text-xs font-extrabold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span> Takso-Taksometr Ishlamoqda
                </span>
                <span id="meterStatusBadge" class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">Yo'lda</span>
            </div>

            <div class="py-4 text-center space-y-2">
                <p class="text-xs text-slate-400 font-medium">Joriy Dostavka Summasi:</p>
                <div class="text-4xl font-black text-emerald-400 tracking-tight" id="liveFareDisplay">0 so'm</div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-800 text-center">
                <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700/60">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Bosib o'tilgan masofa</p>
                    <p id="liveDistDisplay" class="text-lg font-black text-yellow-400 mt-0.5">0.00 km</p>
                </div>
                <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700/60">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Tezlik (Tezometr)</p>
                    <p id="liveSpeedDisplay" class="text-lg font-black text-cyan-400 mt-0.5">0 km/h</p>
                </div>
            </div>

            <div class="mt-4 pt-2">
                <button onclick="finishOrderDelivery()" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3.5 rounded-2xl shadow-lg transition active:scale-98 flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-flag-checkered text-base"></i> Buyurtmani Yetkazdim (Tugatish)
                </button>
            </div>
        </div>

        <!-- BUYURTMALAR RO'YXATI -->
        <div class="space-y-3">
            <h2 class="text-xs font-black uppercase text-slate-500 tracking-wider flex items-center justify-between">
                <span>Mavjud Buyurtmalar</span>
                <button onclick="loadOrders()" class="text-emerald-600 text-xs font-bold hover:underline"><i class="fa-solid fa-rotate-right"></i> Yangilash</button>
            </h2>
            
            <div id="courierOrdersList" class="space-y-3"></div>
        </div>

    </main>

    <script>
        let orders = JSON.parse(localStorage.getItem('tv_orders')) || [];
        let activeOrder = null;
        let watchId = null;
        let lastCoords = null;
        let totalDistanceKm = 0;
        let currentFare = 0;
        const RATE_PER_KM = 4800; // Kilometriga 4,800 so'm

        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
        });

        function loadOrders() {
            orders = JSON.parse(localStorage.getItem('tv_orders')) || [];
            const container = document.getElementById('courierOrdersList');
            if (!container) return;

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl text-center text-slate-400 border border-slate-200">
                        <i class="fa-solid fa-box-open text-3xl mb-2 text-slate-300"></i>
                        <p class="text-xs font-bold">Hozircha faol buyurtmalar yo'q</p>
                    </div>`;
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="bg-white border ${o.status === 'Yo\'lda' ? 'border-amber-400 ring-2 ring-amber-400/20' : 'border-slate-200'} rounded-2xl p-4 shadow-sm space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] bg-emerald-100 text-emerald-800 font-black px-2 py-0.5 rounded-full">#${o.id}</span>
                            <h3 class="font-extrabold text-sm text-slate-800 mt-1">${o.name}</h3>
                            <p class="text-xs text-emerald-700 font-bold"><i class="fa-solid fa-phone text-xs mr-1"></i> ${o.phone}</p>
                        </div>
                        <span class="text-xs font-black px-2.5 py-1 rounded-xl ${getStatusBadgeStyle(o.status)}">${o.status || 'Yangi'}</span>
                    </div>

                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs space-y-1">
                        <p class="text-slate-600 font-medium">📍 Manzil: <strong>${o.address}</strong></p>
                        <p class="text-slate-600 font-medium">💰 Tovar Narxi: <strong>${(o.total || 0).toLocaleString()} so'm</strong></p>
                    </div>

                    ${getActionButton(o)}
                </div>
            `).join('');
        }

        function getStatusBadgeStyle(status) {
            if (status === 'Yo\'lda') return 'bg-amber-100 text-amber-800 border border-amber-300';
            if (status === 'Yetkazildi') return 'bg-emerald-100 text-emerald-800 border border-emerald-300';
            return 'bg-blue-100 text-blue-800 border border-blue-300';
        }

        function getActionButton(order) {
            if (order.status === 'Yetkazildi') {
                return `<div class="text-center text-xs text-emerald-600 font-bold py-1"><i class="fa-solid fa-circle-check"></i> Muvaffaqiyatli yetkazilgan</div>`;
            }
            if (activeOrder && activeOrder.id === order.id) {
                return `<button disabled class="w-full bg-amber-500 text-white font-bold py-2.5 rounded-xl text-xs shadow opacity-90 flex items-center justify-center gap-1.5"><i class="fa-solid fa-spinner animate-spin"></i> Takso-taksometr ishlamoqda...</button>`;
            }
            return `<button onclick="acceptAndStartDelivery(${order.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-extrabold py-3 rounded-xl text-xs shadow transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-motorcycle text-sm"></i> Buyurtmani Oldim (Taksometrni Yoqish)
                    </button>`;
        }

        // BUYURTMANI OLISH VA TAKSOMETRNI YOQISH
        function acceptAndStartDelivery(orderId) {
            const idx = orders.findIndex(o => o.id === orderId);
            if (idx === -1) return;

            if (!navigator.geolocation) {
                alert("Qurilmangizda GPS xizmati qo'llab-quvvatlanmaydi!");
                return;
            }

            activeOrder = orders[idx];
            orders[idx].status = "Yo'lda";
            localStorage.setItem('tv_orders', JSON.stringify(orders));

            totalDistanceKm = 0;
            currentFare = 0;
            lastCoords = null;

            document.getElementById('taximeterBox').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Real vaqt GPS kuzatuvini boshlash
            watchId = navigator.geolocation.watchPosition(
                updatePosition,
                handleGpsError,
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
            );

            loadOrders();
        }

        function updatePosition(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const speedKmH = position.coords.speed ? (position.coords.speed * 3.6) : 0; // m/s -> km/h

            document.getElementById('liveSpeedDisplay').innerText = Math.round(speedKmH) + " km/h";

            if (lastCoords) {
                const distDelta = calculateDistanceKm(lastCoords.lat, lastCoords.lng, lat, lng);
                // Kichik siljish xatolarini (0.005 km dan kichik) inobatga olmaslik
                if (distDelta > 0.005) {
                    totalDistanceKm += distDelta;
                    currentFare = Math.round(totalDistanceKm * RATE_PER_KM);
                }
            }

            lastCoords = { lat, lng };

            document.getElementById('liveDistDisplay').innerText = totalDistanceKm.toFixed(2) + " km";
            document.getElementById('liveFareDisplay').innerText = currentFare.toLocaleString() + " so'm";
        }

        function handleGpsError(err) {
            console.warn("GPS ma'lumoti olinmadi:", err);
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // BUYURTMANI YETKAZISHNI YAKUNLASH
        function finishOrderDelivery() {
            if (!activeOrder) return;

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            const idx = orders.findIndex(o => o.id === activeOrder.id);
            if (idx !== -1) {
                orders[idx].status = "Yetkazildi";
                orders[idx].actualDeliveryFee = currentFare;
                localStorage.setItem('tv_orders', JSON.stringify(orders));
            }

            alert(`Buyurtma yetkazildi!\nJami masofa: ${totalDistanceKm.toFixed(2)} km\nDostavka narxi: ${currentFare.toLocaleString()} so'm`);

            activeOrder = null;
            document.getElementById('taximeterBox').classList.add('hidden');
            loadOrders();
        }
    </script>
</body>
</html>
