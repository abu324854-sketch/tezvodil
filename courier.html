<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TezVodil - Kuryer Paneli</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-10 antialiased selection:bg-emerald-500 selection:text-white">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-emerald-600 p-2 rounded-xl shadow">
                    <i class="fa-solid fa-motorcycle text-xl text-yellow-300"></i>
                </div>
                <div>
                    <h1 class="text-base font-black">TezVodil Kuryer</h1>
                    <p class="text-[10px] text-emerald-400 font-semibold">Ilova GPS Navigatsiyasi</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="openHistoryModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 shadow transition">
                    <i class="fa-solid fa-chart-line"></i> <span>Statistika</span>
                </button>
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-xs p-2.5 rounded-xl border border-slate-700 font-bold flex items-center justify-center">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- DAROMAD KARTASI -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-4 rounded-2xl shadow-lg flex justify-between items-center">
            <div>
                <p class="text-[10px] font-bold uppercase tracking-wider text-emerald-100">Bugungi Jami Daromad</p>
                <h3 id="todayEarning" class="text-2xl font-black mt-0.5">0 so'm</h3>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-bold uppercase tracking-wider text-emerald-100">Bajarildi</p>
                <h3 id="todayCount" class="text-xl font-black mt-0.5 text-yellow-300">0 ta</h3>
            </div>
        </div>

        <!-- BUYURTMALAR RO'YXATI VA MARSHRUTLI XARITA -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-black uppercase text-slate-500 tracking-wider">Yangi Buyurtmalar</h2>
                <button onclick="loadOrders()" class="text-emerald-600 text-xs font-bold hover:underline flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> Yangilash
                </button>
            </div>
            
            <div id="courierActiveOrdersList" class="space-y-3"></div>
        </div>

    </main>

    <!-- STATISTIKA MODALI -->
    <div id="historyModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-extrabold text-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-emerald-600 text-base"></i> Bajarilganlar Tarixi
                </h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="historyOrdersList" class="space-y-2.5 overflow-y-auto flex-1 pr-1"></div>
            <button onclick="closeHistoryModal()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow">Yopish</button>
        </div>
    </div>

    <script>
        const VODIL_CENTER = { lat: 40.1764, lng: 71.7258 };
        let orders = JSON.parse(localStorage.getItem('tv_orders')) || [];
        let vendors = JSON.parse(localStorage.getItem('tv_vendors')) || [];
        
        let activeOrderId = null;
        let watchId = null;
        let lastCoords = null;

        let cMap = null, courierMarker = null, targetMarker = null, routeLine = null;

        let deliveryStage = 'to_store';
        let distStoreKm = 0, distCustKm = 0;
        let fareStore = 0, fareCust = 0;

        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            calculateStats();
        });

        function calculateStats() {
            orders = JSON.parse(localStorage.getItem('tv_orders')) || [];
            const delivered = orders.filter(o => o.status === 'Yetkazildi');
            const total = delivered.reduce((sum, o) => sum + (o.actualDeliveryFee || 0), 0);
            document.getElementById('todayEarning').innerText = total.toLocaleString() + " so'm";
            document.getElementById('todayCount').innerText = delivered.length + " ta";
        }

        function loadOrders() {
            orders = JSON.parse(localStorage.getItem('tv_orders')) || [];
            vendors = JSON.parse(localStorage.getItem('tv_vendors')) || [];
            const container = document.getElementById('courierActiveOrdersList');
            const activeOrders = orders.filter(o => o.status !== 'Yetkazildi');

            if (activeOrders.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl text-center text-slate-400 border border-slate-200 shadow-sm">
                        <i class="fa-solid fa-box-open text-3xl mb-2 text-slate-300"></i>
                        <p class="text-xs font-bold">Hozircha yangi buyurtmalar mavjud emas</p>
                    </div>`;
                return;
            }

            container.innerHTML = activeOrders.map(o => `
                <div class="bg-white border ${activeOrderId === o.id ? 'border-emerald-500 ring-2 ring-emerald-500/20' : 'border-slate-200'} rounded-2xl p-4 shadow-sm space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] bg-emerald-100 text-emerald-800 font-black px-2 py-0.5 rounded-full">#${o.id}</span>
                            <h3 class="font-extrabold text-sm text-slate-800 mt-1">${o.name || "Mijoz"}</h3>
                            <a href="tel:${o.phone || ''}" class="text-xs text-emerald-700 font-bold hover:underline inline-block mt-0.5">
                                <i class="fa-solid fa-phone text-xs mr-1"></i> ${o.phone || "Telefon yo'q"}
                            </a>
                        </div>
                        <span class="text-xs font-black px-2.5 py-1 rounded-xl bg-blue-100 text-blue-800">${o.status || 'Yangi'}</span>
                    </div>

                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs space-y-1">
                        <p class="text-slate-600 font-medium">📍 Manzil: <strong>${o.address || 'Manzil kiritilmagan'}</strong></p>
                        <p class="text-slate-600 font-medium">💳 To'lov: <strong>${o.paymentType || 'Naqd'}</strong></p>
                        <p class="text-slate-600 font-medium">💰 Tovar Summasi: <strong>${(o.total || 0).toLocaleString()} so'm</strong></p>
                    </div>

                    ${renderOrderControls(o)}
                </div>
            `).join('');

            if (activeOrderId) {
                setTimeout(() => initOrUpdateMap(), 250);
            }
        }

        function renderOrderControls(o) {
            if (activeOrderId === o.id) {
                return `
                    <div class="bg-slate-900 text-white p-3 rounded-2xl space-y-2 border border-slate-800 mt-2">
                        <div class="flex justify-between items-center text-[11px] font-bold border-b border-slate-800 pb-1.5">
                            <span class="text-emerald-400">${deliveryStage === 'to_store' ? '🏪 Do\'konga ketilmoqda (1,800 s/km)' : '🏠 Mijozga ketilmoqda (4,800 s/km)'}</span>
                            <span class="text-yellow-400" id="liveFare">0 so'm</span>
                        </div>
                        <div id="cNavMap" class="w-full h-48 rounded-xl border border-slate-700 overflow-hidden"></div>
                        
                        ${deliveryStage === 'to_store' ? `
                            <button onclick="switchToCustomerStage()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-98 text-slate-900 font-extrabold py-3 rounded-xl text-xs shadow transition">
                                Tovarni Oldim (Mijozga Ketish - 4,800 s/km)
                            </button>
                        ` : `
                            <button onclick="finishDelivery(${o.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-extrabold py-3 rounded-xl text-xs shadow transition">
                                Buyurtmani Yetkazdim (Tugatish)
                            </button>
                        `}
                    </div>
                `;
            }

            return `
                <button onclick="startDelivery(${o.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-extrabold py-2.5 rounded-xl text-xs shadow transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-location-arrow"></i> Do'konga Ketdim (Taksometrni yoqish)
                </button>
            `;
        }

        function startDelivery(id) {
            if (!navigator.geolocation) return alert("GPS faol emas!");
            activeOrderId = id;
            deliveryStage = 'to_store';
            distStoreKm = 0; distCustKm = 0;
            fareStore = 0; fareCust = 0;
            lastCoords = null;

            const idx = orders.findIndex(o => o.id === id);
            if (idx !== -1) {
                orders[idx].status = "Yo'lda";
                localStorage.setItem('tv_orders', JSON.stringify(orders));
            }

            loadOrders();

            watchId = navigator.geolocation.watchPosition(updateGPS, err => console.warn(err), { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
        }

        function getTargetCoords() {
            const currentOrder = orders.find(o => o.id === activeOrderId);
            if (!currentOrder) return VODIL_CENTER;

            if (deliveryStage === 'to_store') {
                const storeName = currentOrder.items && currentOrder.items[0] ? currentOrder.items[0].store : null;
                const v = vendors.find(x => x.storeName === storeName);
                return (v && v.coords) ? v.coords : VODIL_CENTER;
            } else {
                return currentOrder.customerCoords || VODIL_CENTER;
            }
        }

        function initOrUpdateMap() {
            const mapContainer = document.getElementById('cNavMap');
            if (!mapContainer) return;

            const targetCoords = getTargetCoords();

            if (!cMap) {
                cMap = L.map('cNavMap').setView([targetCoords.lat, targetCoords.lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(cMap);
            } else {
                cMap.invalidateSize();
            }

            if (targetMarker) cMap.removeLayer(targetMarker);
            targetMarker = L.marker([targetCoords.lat, targetCoords.lng]).addTo(cMap)
                .bindPopup(deliveryStage === 'to_store' ? '🏪 Do\'kon' : '🏠 Mijoz').openPopup();

            if (lastCoords) {
                if (courierMarker) courierMarker.setLatLng([lastCoords.lat, lastCoords.lng]);
                else courierMarker = L.marker([lastCoords.lat, lastCoords.lng]).addTo(cMap);

                if (routeLine) cMap.removeLayer(routeLine);
                const lineColor = deliveryStage === 'to_store' ? '#f59e0b' : '#10b981';

                routeLine = L.polyline([
                    [lastCoords.lat, lastCoords.lng],
                    [targetCoords.lat, targetCoords.lng]
                ], { color: lineColor, weight: 5, opacity: 0.8, dashArray: '8, 8' }).addTo(cMap);

                cMap.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
            } else {
                cMap.setView([targetCoords.lat, targetCoords.lng], 15);
            }
        }

        function switchToCustomerStage() {
            deliveryStage = 'to_customer';
            lastCoords = null;
            loadOrders();
        }

        function updateGPS(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (lastCoords) {
                const delta = calcDistKm(lastCoords.lat, lastCoords.lng, lat, lng);
                if (delta > 0.005) {
                    if (deliveryStage === 'to_store') {
                        distStoreKm += delta;
                        fareStore = Math.round(distStoreKm * 1800);
                    } else {
                        distCustKm += delta;
                        fareCust = Math.round(distCustKm * 4800);
                    }
                }
            }

            lastCoords = { lat, lng };
            initOrUpdateMap();

            const totalFare = fareStore + fareCust;
            const fareEl = document.getElementById('liveFare');
            if (fareEl) fareEl.innerText = totalFare.toLocaleString() + " so'm";
        }

        function calcDistKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function finishDelivery(id) {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            const totalFare = fareStore + fareCust;

            const idx = orders.findIndex(o => o.id === id);
            if (idx !== -1) {
                orders[idx].status = "Yetkazildi";
                orders[idx].actualDeliveryFee = totalFare;
                localStorage.setItem('tv_orders', JSON.stringify(orders));
            }

            alert(`Buyurtma yetkazildi!\nDostavka narxi: ${totalFare.toLocaleString()} so'm`);
            activeOrderId = null;
            cMap = null;
            calculateStats();
            loadOrders();
        }

        function openHistoryModal() { document.getElementById('historyModal').classList.remove('hidden'); renderHistory(); }
        function closeHistoryModal() { document.getElementById('historyModal').classList.add('hidden'); }

        function renderHistory() {
            orders = JSON.parse(localStorage.getItem('tv_orders')) || [];
            const container = document.getElementById('historyOrdersList');
            const delivered = orders.filter(o => o.status === 'Yetkazildi');

            if (delivered.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6 font-bold">Yetkazilgan buyurtmalar yo'q</p>`;
                return;
            }

            container.innerHTML = delivered.map(o => `
                <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs space-y-1">
                    <div class="flex justify-between font-bold">
                        <span>#${o.id} - ${o.name || 'Mijoz'}</span>
                        <span class="text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full text-[10px]">Yetkazildi</span>
                    </div>
                    <p class="text-slate-600">📍 Manzil: ${o.address || ''}</p>
                    <p class="text-emerald-800 font-bold">Dostavka: ${(o.actualDeliveryFee || 0).toLocaleString()} so'm</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
