<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TezVodil - Onlayn yetkazib berish xizmati</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet Xarita Kutubxonasi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-[#f0f4f8] text-slate-800 antialiased selection:bg-emerald-500 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-[#0f172a] text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="bg-emerald-500 text-amber-300 w-8 h-8 rounded-lg flex items-center justify-center font-black text-base shadow">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="text-base font-black tracking-tight leading-none text-white">TezVodil</h1>
                    <p class="text-[10px] text-emerald-400 font-medium leading-tight mt-0.5">Vodil yetkazib berish xizmati</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <a href="courier.html" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 shadow transition">
                    <i class="fa-solid fa-motorcycle text-xs"></i> <span>Kuryer</span>
                </a>
                <button onclick="openCartModal()" class="relative bg-slate-800 hover:bg-slate-700 w-8 h-8 rounded-lg flex items-center justify-center text-emerald-400 border border-slate-700">
                    <i class="fa-solid fa-shopping-bag text-sm"></i>
                    <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center border-2 border-[#0f172a] hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-xl mx-auto w-full px-4 py-6 space-y-6 flex-1">

        <!-- QIDIRUV -->
        <div class="relative max-w-md mx-auto">
            <input type="text" id="searchInput" oninput="filterCatalog()" placeholder="Taom yoki mahsulotlarni qidirish..." class="w-full bg-white border border-slate-200 pl-10 pr-4 py-2.5 rounded-xl text-xs font-semibold shadow-sm focus:outline-none focus:border-emerald-500 text-slate-700 placeholder-slate-400">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
        </div>

        <!-- KATALOG (SOTUVCHILAR QO'SHGAN MAHSULOTLAR UCHUN) -->
        <div id="catalogList" class="grid grid-cols-2 gap-4 max-w-md mx-auto"></div>

    </main>

    <!-- FOOTER NAV -->
    <div class="fixed bottom-0 left-0 right-0 z-40 pb-2 pt-1">
        <nav class="bg-white border border-slate-200/80 rounded-2xl py-2 px-6 shadow-lg max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="text-emerald-600 text-center text-[10px] font-bold flex flex-col items-center">
                <i class="fa-solid fa-house text-base mb-0.5"></i>
                <span>Asosiy</span>
            </a>
            <button onclick="openCartModal()" class="text-slate-400 hover:text-emerald-600 text-center text-[10px] font-bold flex flex-col items-center">
                <i class="fa-solid fa-receipt text-base mb-0.5"></i>
                <span>Buyurtmalarim</span>
            </button>
            <a href="courier.html" class="text-slate-400 hover:text-emerald-600 text-center text-[10px] font-bold flex flex-col items-center">
                <i class="fa-solid fa-motorcycle text-base mb-0.5"></i>
                <span>Kuryer</span>
            </a>
        </nav>
    </div>

    <!-- SAVATCHA MODALI -->
    <div id="cartModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-extrabold text-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-shopping-bag text-emerald-600"></i> Savatcha
                </h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div id="cartItemsList" class="space-y-2.5 overflow-y-auto flex-1 pr-1"></div>

            <div class="border-t pt-3 space-y-2">
                <div class="flex justify-between text-xs font-bold text-slate-700">
                    <span>Jami mahsulotlar:</span>
                    <span id="cartSubtotal" class="text-emerald-600">0 so'm</span>
                </div>
                <button onclick="openCheckoutModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl shadow text-xs transition">
                    Buyurtmani rasmiylashtirish
                </button>
            </div>
        </div>
    </div>

    <!-- RASMIYLASHTIRISH MODALI -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl max-h-[90vh] flex flex-col overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-extrabold text-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-emerald-600"></i> Yetkazish manzili
                </h3>
                <button onclick="closeCheckoutModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="submitOrder(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Ism Familiya</label>
                    <input type="text" id="custName" required placeholder="Ismingiz" class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-semibold focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Telefon raqam</label>
                    <input type="tel" id="custPhone" required value="+998 " class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-semibold focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Manzil matni</label>
                    <input type="text" id="custAddress" required placeholder="Masalan: Vodil markazi, 12-uy" class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-semibold focus:outline-none focus:border-emerald-500">
                </div>

                <!-- XARITADAN LOKATSIYA BELGILASH -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Aniq joylashuvni xaritada belgilang:</label>
                    <div id="checkoutMap" class="w-full h-40 rounded-xl border border-slate-200 shadow-inner"></div>
                    <p class="text-[10px] text-slate-500 mt-1">Koordinata: <span id="coordsText" class="font-bold text-emerald-600">Vodil markazi</span></p>
                </div>

                <!-- TO'LOV TURI -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">To'lov Usuli</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="border border-slate-200 p-2 rounded-xl text-center cursor-pointer hover:border-emerald-500 flex flex-col items-center justify-center gap-0.5">
                            <input type="radio" name="payType" value="Naqd" checked class="accent-emerald-600">
                            <span class="text-[10px] font-bold text-slate-700">💵 Naqd</span>
                        </label>
                        <label class="border border-slate-200 p-2 rounded-xl text-center cursor-pointer hover:border-emerald-500 flex flex-col items-center justify-center gap-0.5">
                            <input type="radio" name="payType" value="Click" class="accent-emerald-600">
                            <span class="text-[10px] font-bold text-blue-600">🔹 Click</span>
                        </label>
                        <label class="border border-slate-200 p-2 rounded-xl text-center cursor-pointer hover:border-emerald-500 flex flex-col items-center justify-center gap-0.5">
                            <input type="radio" name="payType" value="Payme" class="accent-emerald-600">
                            <span class="text-[10px] font-bold text-cyan-600">🔹 Payme</span>
                        </label>
                    </div>
                </div>

                <!-- PROMO-KOD -->
                <div>
                    <div class="flex gap-2">
                        <input type="text" id="promoInput" placeholder="PROMO-KOD (TEZVODIL2026)" class="flex-1 bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-bold uppercase focus:outline-none focus:border-emerald-500">
                        <button type="button" onclick="applyPromoCode()" class="bg-slate-900 text-white text-xs px-3 py-2 rounded-xl font-bold">Qo'llash</button>
                    </div>
                    <p id="promoMsg" class="text-[10px] font-bold mt-1 text-emerald-600 hidden">✓ TEZVODIL2026: 10,000 so'm chegirma berildi!</p>
                </div>

                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs space-y-1">
                    <div class="flex justify-between"><span>Mahsulotlar:</span> <strong id="summarySub">0 so'm</strong></div>
                    <div class="flex justify-between"><span>Dostavka (Taxminiy):</span> <strong id="summaryDel">4,800 so'm</strong></div>
                    <div class="flex justify-between text-emerald-700 border-t pt-1 font-black text-sm"><span>Jami to'lov:</span> <strong id="summaryTotal">0 so'm</strong></div>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl shadow text-xs transition">
                    Buyurtmani tasdiqlash
                </button>
            </form>
        </div>
    </div>

    <script>
        const VODIL_CENTER = { lat: 40.1764, lng: 71.7258 };
        let userCoords = { ...VODIL_CENTER };
        let map = null, marker = null;
        let cart = [];
        let orders = JSON.parse(localStorage.getItem('tv_orders')) || [];
        let products = JSON.parse(localStorage.getItem('tv_products')) || []; // LocalStorage'dan olinadi
        let appliedDiscount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            renderCatalog(products);
            updateCartUI();
        });

        function renderCatalog(items) {
            const list = document.getElementById('catalogList');
            if (!items || items.length === 0) {
                list.innerHTML = `
                    <div class="col-span-2 text-center py-12 text-slate-400 space-y-2">
                        <i class="fa-solid fa-box-open text-3xl text-slate-300"></i>
                        <p class="text-xs font-bold">Hozircha mahsulotlar mavjud emas</p>
                    </div>`;
                return;
            }

            list.innerHTML = items.map(p => `
                <div class="bg-white border border-slate-100 rounded-2xl p-2.5 shadow-sm flex flex-col justify-between space-y-2">
                    <img src="${p.img || 'https://via.placeholder.com/300'}" class="w-full h-28 object-cover rounded-xl" alt="${p.name}">
                    <div class="space-y-0.5">
                        <span class="inline-block text-[9px] bg-emerald-100/80 text-emerald-800 font-bold px-2 py-0.5 rounded-md">${p.store || 'Do\'kon'}</span>
                        <h4 class="font-extrabold text-xs text-slate-800 leading-snug">${p.name}</h4>
                        <p class="text-xs font-black text-emerald-600">${(p.price || 0).toLocaleString()} so'm</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-extrabold py-2 rounded-xl text-xs shadow transition">
                        Qo'shish
                    </button>
                </div>
            `).join('');
        }

        function filterCatalog() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(q) || (p.store && p.store.toLowerCase().includes(q)));
            renderCatalog(filtered);
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;
            const exist = cart.find(i => i.id === id);
            if (exist) exist.qty++;
            else cart.push({ ...prod, qty: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const totalQty = cart.reduce((s, i) => s + i.qty, 0);
            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            const list = document.getElementById('cartItemsList');
            if (cart.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs font-bold">Savatcha bo'sh</div>`;
                document.getElementById('cartSubtotal').innerText = "0 so'm";
                return;
            }

            let sub = 0;
            list.innerHTML = cart.map((item, idx) => {
                sub += item.price * item.qty;
                return `
                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs">
                        <div>
                            <p class="font-black text-slate-800">${item.name}</p>
                            <p class="text-emerald-600 font-bold">${item.price.toLocaleString()} so'm x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${idx}, -1)" class="w-6 h-6 bg-slate-200 rounded-lg font-bold">-</button>
                            <span class="font-black">${item.qty}</span>
                            <button onclick="changeQty(${idx}, 1)" class="w-6 h-6 bg-slate-200 rounded-lg font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cartSubtotal').innerText = sub.toLocaleString() + " so'm";
        }

        function changeQty(idx, delta) {
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            updateCartUI();
        }

        function openCartModal() { document.getElementById('cartModal').classList.remove('hidden'); }
        function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }

        function openCheckoutModal() {
            if (cart.length === 0) return alert("Savatcha bo'sh!");
            closeCartModal();
            document.getElementById('checkoutModal').classList.remove('hidden');

            const sub = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('summarySub').innerText = sub.toLocaleString() + " so'm";
            document.getElementById('summaryTotal').innerText = Math.max(0, sub + 4800 - appliedDiscount).toLocaleString() + " so'm";

            setTimeout(() => {
                if (!map) {
                    map = L.map('checkoutMap').setView([VODIL_CENTER.lat, VODIL_CENTER.lng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    marker = L.marker([VODIL_CENTER.lat, VODIL_CENTER.lng], { draggable: true }).addTo(map);

                    marker.on('dragend', function(e) {
                        const pos = marker.getLatLng();
                        userCoords = { lat: pos.lat, lng: pos.lng };
                        document.getElementById('coordsText').innerText = `${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}`;
                    });

                    map.on('click', function(e) {
                        marker.setLatLng(e.latlng);
                        userCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
                        document.getElementById('coordsText').innerText = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
                    });
                } else {
                    map.invalidateSize();
                }
            }, 250);
        }

        function closeCheckoutModal() { document.getElementById('checkoutModal').classList.add('hidden'); }

        function applyPromoCode() {
            const code = document.getElementById('promoInput').value.trim().toUpperCase();
            const msg = document.getElementById('promoMsg');
            if (code === 'TEZVODIL2026') {
                appliedDiscount = 10000;
                msg.classList.remove('hidden');
                const sub = cart.reduce((s, i) => s + (i.price * i.qty), 0);
                document.getElementById('summaryTotal').innerText = Math.max(0, sub + 4800 - appliedDiscount).toLocaleString() + " so'm";
            } else {
                alert("Noto'g'ri promo-kod!");
            }
        }

        function submitOrder(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const paymentType = document.querySelector('input[name="payType"]:checked').value;

            const sub = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const deliveryFee = 4800;
            const finalTotal = Math.max(0, sub + deliveryFee - appliedDiscount);

            const newOrder = {
                id: Date.now(),
                name, phone, address, paymentType,
                customerCoords: { ...userCoords },
                items: [...cart],
                total: finalTotal,
                deliveryFee,
                status: "Yangi",
                date: new Date().toLocaleString()
            };

            orders.push(newOrder);
            localStorage.setItem('tv_orders', JSON.stringify(orders));
            cart = [];
            updateCartUI();
            closeCheckoutModal();
            alert("Buyurtmangiz muvaffaqiyatli qabul qilindi!");
        }
    </script>
</body>
</html>
